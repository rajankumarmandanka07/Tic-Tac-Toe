<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conway's Game of Life</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/styles/styles.css">
  </head>
  <body>
    <div class="container text-center">
      <h1 class="my-4 text-primary">Conway's Game of Life</h1>
      <div class="mb-2 d-flex justify-content-center control-buttons">
        <button id="playBtn" class="btn btn-success btn-lg">Play</button>
        <button id="pauseBtn" class="btn btn-secondary btn-lg">Pause</button>
        <button id="resetBtn" class="btn btn-danger btn-lg">Reset</button>
        <button id="randomBtn" class="btn btn-primary btn-lg">Random</button>
      </div>
      <div class="text-center">
        <h4 class="text-info">Game Stats</h4>
      </div>

      <div class="d-flex justify-content-center">
          <h4 class="mx-3">Generation: <span id="generationCount">0</span></h4>
          <h4>Population: <span id="populationCount">0</span></h4>
      </div>

      <div class="d-flex justify-content-center">
        <div id="grid" class="border"></div>
      </div>

    </div>

    <script src="script.js"></script>
  </body>
</html>
